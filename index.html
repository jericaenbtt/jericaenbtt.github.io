<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sendas y rutas por Jérica</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}


html {
  font-size: 100%;
}


/* ===== ESTRUCTURA GENERAL ===== */
body {
  color: #fff;
  background: #999;
  
  min-height: 100svh;
  display: flex;
  flex-direction: column;

}

/* ===== HERO ===== */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

#menu-toggle {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 28px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  z-index: 1001;
}




.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      rgba(0,0,0,0.45),
      rgba(0,0,0,0.45)
    ),
    url("fondo.jpg") center 15% / 115% no-repeat;
  z-index: -1;
}

/* ===== HEADER ===== */
header {
  text-align: center;
  padding: 40px 20px;
}

header h1 {
  font-size: 3rem;
  text-shadow: 0 4px 8px rgba(0,0,0,0.6);
}

/* ===== MAIN ===== */
main {
  flex-grow: 1;
  display: flex;
  flex-direction: column; /* <-- ESTA LÍNEA HACE LA MAGIA */
  justify-content: center;
  align-items: center;    /* <-- CAMBIADO: centrados los botones */
  gap: 30px;   /* <-- REDUCIDO A 30px PARA QUE QUEDE MEJOR EN VERTICAL */
  
  
}

/* ===== BOTONES ===== */
.boton {
  width: 260px;
  padding: 30px 20px;
  text-align: center;
  font-size: 1.4rem;
  font-weight: bold;
  border-radius: 14px;
  text-decoration: none;
  color: #fff;
  background: rgba(0,0,0,0.65);
  border: 2px solid rgba(255,255,255,0.5);
  transition: transform 0.2s, background 0.2s;
  cursor: pointer;
  position: relative;
  margin-left: 150px;    /* <-- ESTA LÍNEA: Empuja los botones 150 píxeles a la derecha del centro */
}

.boton:hover {
  transform: scale(1.05);
  background: rgba(0,0,0,0.8);
}

.inactivo {
  opacity: 0.45;
  pointer-events: none;
}

/* ===== TOOLTIP (SOLO PC) ===== */
@media (hover:hover) {
  .boton[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: -55px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    white-space: nowrap;
  }
}

/* ===== FOOTER ===== */
footer {
  text-align: center;
  padding: 15px;
  font-size: 0.9rem;
  background: rgba(0,0,0,0.5);
  margin-top: auto;
}

/* ===== RESPONSIVE MÓVIL ===== */
@media (max-width: 700px) {

.hero {
  min-height: 100svh;
   justify-content: center;
}

  .hero::before {
    background:
      linear-gradient(
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.45)
      ),
     url("fondo2.jpg") top center / cover no-repeat;
  }

  header h1 {
    font-size: 1.5rem;
  }

main {
  display: none;
}
  
.boton {
    width: 50%;
    max-width: 340px;
    font-size: 0.7rem;
    padding: 22px 20px;
  }

  footer {
    font-size: 0.5rem;
  }

  
  
}

@media (min-width: 701px) {
  #menu-toggle {
    display: none;
  }
}

#mobile-menu {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100svh;
  background: rgba(0,0,0,0.95);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 24px;
  z-index: 1000;
}

#mobile-menu a {
  color: white;
  font-size: 1.6rem;
  text-decoration: none;
}

#mobile-menu .disabled {
  opacity: 0.4;
  pointer-events: none;
}

#mobile-menu.open {
  display: flex;
}
</style>
</head>

<body>

<div class="hero">

<button id="menu-toggle" aria-label="Menú">☰</button>

  <header>
    <h1>Jérica en BTT: sendas y rutas</h1>
  </header>

  <main>
    
        <!-- <div class="boton inactivo">
      Deshabilitado
    </div> -->
    
    <a
      href="sendas/index.html"
      target="_blank"
      rel="noopener noreferrer"
      class="top"
    <!-- data-tooltip="Aquí se ven las sendas grabadas." -->
    >
      Sendas ↗
    </a>

    <a
      href="rutas/index.html"
      target="_blank"
      rel="noopener noreferrer"
      class="boton">
    <!--   data-tooltip="Rutas circulares origen Jérica." -->
    
      rutas circulares↗
    </a>
    

  </main>

</div>

<footer>
  Página en construcción. Contacto: butradiego@hotmail.com
</footer>


<nav id="mobile-menu">
   <!-- <a class="disabled">Deshabilitado</a> -->
  
  <!-- 1. Corregido a minúscula para que coincida con la carpeta -->
  <a href="sendas/index.html">Sendas</a>
  
  <!-- 2. Corregido 'class' por 'href' y puesto en minúscula -->
  <a href="rutas/index.html">Rutas circulares</a>
  
 
  
  <!-- 3. Añadido cierre del menú al pulsar en Información o cerrar -->
  <a href="#" onclick="document.getElementById('mobile-menu').classList.remove('open')">Cerrar Menú</a>
</nav>


<script>
  const toggle = document.getElementById("menu-toggle");
  const menu = document.getElementById("mobile-menu");

  toggle.addEventListener("click", () => {
    menu.classList.toggle("open");
  });
</script>

</body>
</html>
